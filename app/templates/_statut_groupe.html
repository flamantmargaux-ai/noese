{% set g = l.groupe if l else g %}
{% if g.statut == "ecarte" %}<span class="statut statut-neutre">Écarté</span>
{% elif g.statut in ("demande", "repondu") %}<span class="statut statut-neutre">{{ "Demandé" if g.statut == "demande" else "Répondu" }}</span>
{% else %}<span class="statut statut-{{ g.verdict or 'neutre' }}">{{ VERDICTS[g.verdict] }}</span>{% endif %}
