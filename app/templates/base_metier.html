<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>{% block titre %}Une question d’habitant{% endblock %} · Noèse</title>
  <link rel="icon" href="/favicon.ico" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/noese.css?v={{ version_statique }}">
  <script src="/static/js/dictee.js?v={{ version_statique }}" defer></script>
</head>
<body class="page-metier">
  <a class="lien-evitement" href="#contenu">Aller au contenu</a>
  <header class="entete">
    <div class="conteneur conteneur-etroit">
      <span class="marque">
        {% include "_logo.html" %}
        <span class="produit">Noèse</span>
      </span>
    </div>
  </header>
  <main id="contenu" tabindex="-1">
    <div class="conteneur conteneur-etroit">
      {% block contenu %}{% endblock %}
    </div>
  </main>
</body>
</html>
